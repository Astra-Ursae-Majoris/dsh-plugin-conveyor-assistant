name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build host + browser bundles
        run: npm run build

      - name: Typecheck against DSH 0.2.2-rc.5 types
        run: npm run typecheck

      - name: Pre-publish self check
        run: npm run verify

      - name: Runtime smoke test
        run: npm run smoke

      # lib/ 必须与源码同步：构建后工作区应当没有变化
      - name: lib/ must be committed and up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::lib/ is out of date — run 'npm run build' and commit the result"
            git status --porcelain
            exit 1
          fi
